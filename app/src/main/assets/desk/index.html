<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#13171c"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'"><title>Koma Studio</title><link rel="stylesheet" href="desk.css"></head><body>
<header id="top"><button class="brand" data-action="projects" aria-label="プロジェクト一覧"><svg viewBox="0 0 26 24"><path d="M1 2h5v20H1zm7 10L16 2h7l-9 10 9 10h-7z"/></svg><strong>KOMA</strong><small>STUDIO</small></button><div class="grow"></div><button class="icon" id="undo" data-action="undo" aria-label="元に戻す"></button><button class="icon" id="redo" data-action="redo" aria-label="やり直す"></button><button class="export" data-action="export"></button></header>
<main id="work"><section id="viewer"><div class="projectbar"><button id="projectTitle" data-action="projects"></button><button id="spec" class="spec" data-action="canvas"></button></div>
<div id="monitor"><div id="stage"><div id="pictures"></div><div id="overlays"></div><div id="guides" hidden></div></div><button id="guideBtn" class="screenicon" data-action="guides" title="三分割ガイド"></button></div>
<div id="transport"><div class="time"><button id="time" data-action="jump"></button><small id="total"></small></div><div class="playgroup"><button class="icon" data-action="prev" aria-label="1フレーム戻る"></button><button id="play" data-action="play" aria-label="再生"></button><button class="icon" data-action="next" aria-label="1フレーム進む"></button></div><button class="icon" data-action="marker" aria-label="マーカー"></button></div></section>
<section id="edit"><div class="linehead"><h2>タイムライン</h2><button id="snap" class="tog" data-action="snap" title="吸着"></button><div class="grow"></div><button class="mini" data-action="zoomOut" aria-label="タイムライン縮小">−</button><span id="zoomLabel"></span><button class="mini" data-action="zoomIn" aria-label="タイムライン拡大">＋</button></div>
<div class="timeline"><div id="trackNames"></div><div id="scroll"><div id="tracks"></div></div></div>
<div class="selectedbar"><span id="selection"></span><button data-action="details" class="miniDetail">詳細</button></div>
<div class="quicktools"><button data-action="split"></button><button data-action="leftTrim"></button><button data-action="rightTrim"></button><button data-action="dup"></button><button data-action="delete"></button></div>
</section></main>
<nav id="tools"><button data-action="assets"></button><button data-action="details"></button><button data-action="text"></button><button data-action="audio"></button><button data-action="overlay"></button><button class="aiNav" data-action="ai"></button></nav>
<div id="shade" hidden><section id="sheet" role="dialog" aria-modal="true"><div class="grip"></div><header><h2 id="sheetTitle"></h2><button class="icon" data-action="close" aria-label="閉じる"></button></header><div id="body"></div></section></div>
<div id="toast" role="status" hidden></div><div id="progress" hidden><button data-action="progress"><span id="progressText"></span><i id="progressBar"></i></button></div>
<script src="engine.js"></script><script src="planner.js"></script><script src="desk.js"></script><script src="panels.js"></script></body></html>
